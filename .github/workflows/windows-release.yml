name: Build Windows installer

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish the Windows x64 app
        run: dotnet publish DOTA2ChatSpy.csproj -c Release -r win-x64 --self-contained true -o dist/chat-spy-publish -p:DebugType=None -p:DebugSymbols=false
      - name: Build the installer
        shell: pwsh
        run: |
          $version = ([xml](Get-Content DOTA2ChatSpy.csproj -Raw)).Project.PropertyGroup.Version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "The release tag must match v$version from DOTA2ChatSpy.csproj."
          }
          iscc.exe "/DAppVersion=$version" installer/DOTA2ChatSpy.iss
      - uses: actions/upload-artifact@v4
        with:
          name: DOTA2-Chat-Spy-Setup-x64
          path: dist/DOTA2-Chat-Spy-Setup-x64.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: DOTA2-Chat-Spy-Setup-x64
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" DOTA2-Chat-Spy-Setup-x64.exe --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
